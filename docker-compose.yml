version: '3.8'

services:
  career-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_ai_agent_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-5-mini}
      - TEMPERATURE=${TEMPERATURE:-0.0}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-career-ai-agent-prod}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
      - ./career_agent_production.db:/app/career_agent_production.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_ai_agent_mcp
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-5-mini}
      - TEMPERATURE=${TEMPERATURE:-0.0}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "run_mcp_server.py", "--transport", "sse", "--host", "0.0.0.0", "--port", "8502"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8502/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

