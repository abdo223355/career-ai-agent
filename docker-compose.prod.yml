services:
  career-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_ai_agent_app_prod
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-5-mini}
      - TEMPERATURE=${TEMPERATURE:-0.0}
      # LangSmith tracing (optional in production, keep false if you want to save logs/costs)
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-career-ai-agent-prod}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./career_agent_production.db:/app/career_agent_production.db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_ai_agent_mcp_prod
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-5-mini}
      - TEMPERATURE=${TEMPERATURE:-0.0}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "run_mcp_server.py", "--transport", "sse", "--host", "0.0.0.0", "--port", "8502"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8502/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
